<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send a photo to the frame</title>
<style>
  :root {
    --ivory: #FAF8F4;
    --warm-white: #FFFFFF;
    --charcoal: #1C1C1E;
    --muted: #6B6860;
    --border: #E8E4DC;
    --accent: #D4845A;
    --accent-light: #FAF0EA;
    --green: #3B6D11;
    --green-light: #EAF3DE;
    --radius: 16px;
    --font: 'Georgia', 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--ivory);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
    color: var(--charcoal);
  }

  .frame-icon {
    width: 64px; height: 64px;
    margin: 0 auto 1.5rem;
    background: var(--warm-white);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .frame-icon svg { width: 32px; height: 32px; color: var(--accent); }

  h1 {
    font-family: var(--font);
    font-size: 1.75rem; font-weight: normal;
    text-align: center; line-height: 1.3;
    margin-bottom: 0.5rem; color: var(--charcoal);
  }

  .subtitle {
    color: var(--muted); font-size: 0.9375rem;
    text-align: center; margin-bottom: 2.5rem; line-height: 1.5;
  }

  .card {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
    width: 100%; max-width: 420px;
  }

  .upload-zone {
    border: 1.5px dashed var(--border);
    border-radius: 12px; padding: 2rem 1rem;
    text-align: center; cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    background: var(--ivory); margin-bottom: 1.25rem;
    position: relative;
  }
  .upload-zone:hover { border-color: var(--accent); background: var(--accent-light); }
  .upload-zone.has-file { border-color: var(--accent); background: var(--accent-light); }
  .upload-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0;
    cursor: pointer; width: 100%; height: 100%;
  }

  .upload-icon { width: 40px; height: 40px; margin: 0 auto 0.75rem; color: var(--accent); }
  .upload-label { font-size: 0.9375rem; font-weight: 500; color: var(--charcoal); margin-bottom: 0.25rem; pointer-events: none; }
  .upload-sub { font-size: 0.8125rem; color: var(--muted); pointer-events: none; }

  .preview-wrap { display: none; flex-direction: column; align-items: center; gap: 0.5rem; }
  .preview-wrap img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
  .preview-name { font-size: 0.8125rem; color: var(--muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .field-label {
    display: block; font-size: 0.8125rem; font-weight: 500;
    color: var(--muted); margin-bottom: 0.375rem;
    text-transform: uppercase; letter-spacing: 0.04em;
  }

  input[type="text"], textarea {
    width: 100%; border: 1px solid var(--border);
    border-radius: 10px; padding: 0.6875rem 0.875rem;
    font-size: 0.9375rem; font-family: var(--sans);
    background: var(--ivory); color: var(--charcoal);
    outline: none; transition: border-color 0.15s; margin-bottom: 1rem;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); background: #fff; }
  textarea { resize: none; height: 80px; line-height: 1.5; }

  .send-btn {
    width: 100%; padding: 0.875rem;
    background: var(--accent); color: white;
    border: none; border-radius: 10px;
    font-size: 1rem; font-weight: 500; cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    letter-spacing: 0.01em; margin-top: 0.25rem;
  }
  .send-btn:hover { opacity: 0.9; }
  .send-btn:active { transform: scale(0.99); }
  .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .status {
    display: none; margin-top: 1rem;
    border-radius: 10px; padding: 0.875rem 1rem;
    font-size: 0.875rem; line-height: 1.5; text-align: center;
  }
  .status.success { display: block; background: var(--green-light); color: var(--green); border: 1px solid #C0DD97; }
  .status.error { display: block; background: #FCEBEB; color: #A32D2D; border: 1px solid #F7C1C1; }

  .note { font-size: 0.8rem; color: var(--muted); text-align: center; margin-top: 1rem; line-height: 1.5; }
</style>
</head>
<body>

<div class="frame-icon">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2"/>
    <circle cx="8.5" cy="8.5" r="1.5"/>
    <polyline points="21 15 16 10 5 21"/>
  </svg>
</div>

<h1>Send a photo<br>to the frame</h1>
<p class="subtitle">Pick a photo from your phone<br>and it'll appear on the frame.</p>

<div class="card">
  <div class="upload-zone" id="dropzone">
    <input type="file" accept="image/*" id="file-input" onchange="handleFile(this)">
    <div id="upload-default">
      <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 16 12 12 8 16"/>
        <line x1="12" y1="12" x2="12" y2="21"/>
        <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
      </svg>
      <div class="upload-label">Tap to choose a photo</div>
      <div class="upload-sub">JPG, PNG, HEIC · up to 10 MB</div>
    </div>
    <div class="preview-wrap" id="preview-wrap">
      <img id="preview-img" src="" alt="Preview">
      <div class="preview-name" id="preview-name"></div>
    </div>
  </div>

  <label class="field-label" for="sender-name">Your name</label>
  <input type="text" id="sender-name" placeholder="e.g. Jess">

  <label class="field-label" for="message">Message (optional)</label>
  <textarea id="message" placeholder="Add a caption or note…"></textarea>

  <button class="send-btn" id="send-btn" onclick="sendPhoto()">Send to frame →</button>

  <div class="status" id="status"></div>
</div>

<p class="note">Photos go directly to the Wongs' frame.</p>

<script>
let selectedFile = null;

function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  selectedFile = file;

  document.getElementById('dropzone').classList.add('has-file');
  document.getElementById('upload-default').style.display = 'none';
  const wrap = document.getElementById('preview-wrap');
  wrap.style.display = 'flex';
  document.getElementById('preview-name').textContent = file.name;

  const reader = new FileReader();
  reader.onload = e => { document.getElementById('preview-img').src = e.target.result; };
  reader.readAsDataURL(file);
}

async function sendPhoto() {
  if (!selectedFile) { showStatus('error', 'Please choose a photo first.'); return; }

  const name = document.getElementById('sender-name').value.trim();
  const message = document.getElementById('message').value.trim();
  const btn = document.getElementById('send-btn');

  btn.disabled = true;
  btn.textContent = 'Sending…';
  hideStatus();

  const reader = new FileReader();
  reader.onload = async e => {
    const base64 = e.target.result;

    try {
      const res = await fetch('/.netlify/functions/send-photo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fileData: base64,
          fileName: selectedFile.name,
          name: name || 'A friend',
          message: message || ''
        })
      });

      const data = await res.json();

      if (data.status === 'ok') {
        showStatus('success', '🎉 Photo sent! It should appear on the frame shortly.');
        btn.textContent = 'Send another →';
        btn.disabled = false;
        selectedFile = null;
        document.getElementById('file-input').value = '';
        document.getElementById('dropzone').classList.remove('has-file');
        document.getElementById('upload-default').style.display = 'block';
        document.getElementById('preview-wrap').style.display = 'none';
        document.getElementById('sender-name').value = '';
        document.getElementById('message').value = '';
      } else {
        showStatus('error', 'Something went wrong. Please try again.');
        btn.textContent = 'Send to frame →';
        btn.disabled = false;
      }
    } catch (err) {
      showStatus('error', 'Network error — please check your connection and try again.');
      btn.textContent = 'Send to frame →';
      btn.disabled = false;
    }
  };
  reader.readAsDataURL(selectedFile);
}

function showStatus(type, msg) {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.textContent = msg;
}
function hideStatus() {
  document.getElementById('status').className = 'status';
}
</script>
</body>
</html>
